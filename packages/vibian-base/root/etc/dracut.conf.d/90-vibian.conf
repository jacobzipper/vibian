# Vibian: booting a read-only snapper snapshot from the GRUB snapshots menu
# passes rd.overlay=1 (set in /etc/default/grub-btrfs/config). dracut's
# overlayfs module then lays a RAM overlay over the snapshot, so the system
# boots normally and every change is dropped at reboot. `vibian undo --to N`
# is how a snapshot becomes permanent.
add_dracutmodules+=" overlayfs "
