# Vibian: per-turn snapshots (`vibian hook`). Codex runs hooks from this
# managed file without asking you to trust them first. Your own hooks in
# ~/.codex still run as well.
[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/usr/bin/vibian hook turn-start --agent codex"
timeout = 30

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "/usr/bin/vibian hook turn-end --agent codex"
timeout = 30
