set timeout=10

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# Ubuntu's arm64 workarounds for Snapdragon X laptop firmware, kept as is
set cmdline=
if [ "$grub_cpu" = arm64 ]; then
  smbios --type 4 --get-string 5 --set proc_version
  regexp "Snapdragon.*" "$proc_version"
  if [ $? = 0 ]; then
    if [ $lockdown != "y" ]; then
      cutmem 0x8800000000 0x8fffffffff
    fi
    cmdline="clk_ignore_unused pd_ignore_unused arm64.nopauth"
  fi
fi

menuentry "Install Vibian" {
    set gfxpayload=keep
    linux  /casper/vmlinuz $cmdline @CMDLINE@ ---
    initrd /casper/initrd
}
menuentry "Install Vibian (safe graphics)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz $cmdline @CMDLINE@ nomodeset ---
    initrd /casper/initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
    exit 1
}
menuentry 'UEFI Firmware Settings' {
    fwsetup
}
fi
